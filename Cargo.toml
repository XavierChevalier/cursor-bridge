[package]
name = "cursor_bridge"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible gateway for the Cursor CLI"
license = "MIT"
readme = "README.md"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
